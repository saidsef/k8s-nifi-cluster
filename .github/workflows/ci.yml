---
name: CI
on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/ci.yml"
      - "deployment/**"
      - "kind-config.yml"
  pull_request:
    branches:
      - main
    paths:
      - ".github/workflows/ci.yml"
      - "deployment/**"
      - "kind-config.yml"
  workflow_dispatch:

jobs:
  k8s-test:
    runs-on: ubuntu-latest
    if: ${{ ! contains(github.ref, 'main') }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Prepare shared certificate mount
        run: mkdir -p /tmp/nifi-certs

      - name: Create k8s Kind Cluster
        uses: helm/kind-action@v1.14.0
        with:
          # The action defaults to kind v0.31.0, which cannot build a v1.37 node.
          version: v0.33.0
          kubectl_version: v1.37.0
          config: kind-config.yml
          cluster_name: nifi-test

      - name: Validate kustomize builds
        run: |
          for dir in $(find deployment -name kustomization.yml -exec dirname {} \;); do
            echo "building ${dir}"
            kubectl kustomize "${dir}" > /dev/null
          done

      - name: Run K8s test
        run: |
          kubectl apply -k deployment/
          kubectl get all,ing,pvc -n nifi

      - name: Diagnostics
        if: failure()
        run: |
          kubectl get pods -A -o wide
          kubectl get events -n nifi --sort-by=.lastTimestamp

  auto-approve:
    runs-on: ubuntu-latest
    needs: [k8s-test]
    if: ${{ github.event_name == 'pull_request' }}
    steps:
    - name: Auto Approve PR
      uses: actions/github-script@v9
      with:
       script: |
        github.rest.pulls.createReview({
          owner: context.repo.owner,
          repo: context.repo.repo,
          pull_number: context.issue.number,
          event: "APPROVE"
        })
