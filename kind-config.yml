---
kind: Cluster
apiVersion: kind.x-k8s.io/v1alpha4
nodes:
- role: control-plane
  image: kindest/node:v1.37.0
  # The ingress controller selects on this label, so it lands on the node that
  # owns the 80/443 host port mappings below.
  labels:
    ingress-ready: "true"
  extraPortMappings:
  - containerPort: 80
    hostPort: 80
    protocol: TCP
  - containerPort: 443
    hostPort: 443
    protocol: TCP
  extraMounts:
  - hostPath: /tmp/nifi-certs
    containerPath: /data/nifi-certs
- role: worker
  image: kindest/node:v1.37.0
  extraMounts:
  - hostPath: /tmp/nifi-certs
    containerPath: /data/nifi-certs
